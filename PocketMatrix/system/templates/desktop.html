<!DOCTYPE html>
<html>
<head>
    <title>PocketMatrix CE</title>
    <style>
        body { background: #008080; font-family: 'Tahoma', sans-serif; overflow: hidden; margin: 0; }
        #taskbar { position: absolute; bottom: 0; width: 100%; height: 30px; background: #c0c0c0; border-top: 2px solid #fff; display: flex; align-items: center; }
        #start-btn { height: 22px; width: 60px; background: #c0c0c0; border: 2px outset #fff; font-weight: bold; margin-left: 2px; cursor: pointer; }
        .window { position: absolute; background: #c0c0c0; border: 2px outset #fff; padding: 2px; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); }
        .window-header { background: #000080; color: #fff; padding: 2px 5px; font-weight: bold; display: flex; justify-content: space-between; cursor: move; }
        .window-header span.close-btn { cursor: pointer; background: #c0c0c0; color: #000; border: 1px outset #fff; padding: 0 2px; font-size: 10px; }
        .window-content { background: #fff; border: 2px inset #fff; overflow-y: auto; font-size: 12px; }
        
        #pocket-cmd { top: 20px; left: 20px; width: 320px; z-index: 10; }
        #pocket-mail { top: 60px; left: 360px; width: 300px; height: 250px; z-index: 11; }
        #pocket-docs { top: 100px; left: 60px; width: 400px; height: 300px; z-index: 12; }
        #pocket-excel { top: 150px; left: 100px; width: 600px; height: 400px; display: none; z-index: 15; }
        #pocket-net { top: 200px; left: 200px; width: 350px; height: 250px; display: none; z-index: 16; }
        
        /* Start Menu Styles */
        #start-menu { 
            position: absolute; bottom: 30px; left: 0; width: 180px; background: #c0c0c0; border: 2px outset #fff; 
            display: none; z-index: 1000; box-shadow: 2px -2px 5px rgba(0,0,0,0.5);
        }
        .start-item { 
            padding: 5px 10px; display: flex; align-items: center; cursor: pointer; font-size: 11px;
            border-bottom: 1px solid #999;
        }
        .start-item:hover { background: #000080; color: #fff; }
        .start-icon { width: 16px; height: 16px; margin-right: 10px; background: #999; }
        
        .icon { display: inline-block; width: 70px; text-align: center; margin: 10px; cursor: pointer; vertical-align: top; }
        .icon-img { width: 32px; height: 32px; margin: 0 auto 5px auto; background-size: cover; }
        .icon-folder { background: #e8d06a; border: 1px solid #b59b36; border-radius: 2px 2px 0 0; position: relative; }
        .icon-folder::before { content: ""; position: absolute; top: -4px; left: 0; width: 12px; height: 4px; background: #e8d06a; border: 1px solid #b59b36; border-bottom: none; border-radius: 2px 2px 0 0; }
        .icon-db { background: #4a90e2; border: 1px solid #0050a0; border-radius: 50% 50% 50% 50% / 20% 20% 20% 20%; position: relative; }
        .icon-db::after { content: ""; position: absolute; top: 5px; left: -1px; right: -1px; border-top: 1px solid #0050a0; border-bottom: 1px solid #0050a0; height: 10px; }
        
        table.excel95 { border-collapse: collapse; width: 100%; font-family: 'Arial', sans-serif; font-size: 11px; }
        table.excel95 th { background: #c0c0c0; border: 1px outset #fff; padding: 2px 5px; font-weight: normal; text-align: center; }
        table.excel95 td { border: 1px solid #ccc; padding: 2px 5px; white-space: nowrap; }
        .excel-toolbar { background: #c0c0c0; padding: 5px; border-bottom: 2px inset #fff; display: flex; gap: 10px; align-items: center; }
        select, button { font-family: 'Tahoma', sans-serif; font-size: 11px; }
    </style>
</head>
<body>
    <div id="desktop">
        <div class="window" id="pocket-cmd">
            <div class="window-header"><span>Pocket CMD</span><span class="close-btn" onclick="document.getElementById('pocket-cmd').style.display='none'">X</span></div>
            <div class="window-content" style="height: 200px; display: flex; flex-direction: column;">
                <div id="cmd-out" style="flex-grow: 1; background: #000; color: #0f0; font-family: monospace; padding: 2px; overflow-y: auto;">
                    H2O Matrix [Version 8.0]<br>>
                </div>
                <input type="text" id="cmd-in" style="width: 100%; border: none; border-top: 1px solid #333; background: #000; color: #0f0; outline: none; padding: 2px; box-sizing: border-box; font-family: monospace;">
            </div>
        </div>

        <div class="window" id="pocket-mail">
            <div class="window-header"><span>Pocket Mail (KQML)</span><span class="close-btn" onclick="document.getElementById('pocket-mail').style.display='none'">X</span></div>
            <div class="window-content" id="mail-list" style="height: calc(100% - 20px);"></div>
        </div>

        <div class="window" id="pocket-docs">
            <div class="window-header"><span id="docs-title">My Documents</span><span class="close-btn" onclick="document.getElementById('pocket-docs').style.display='none'">X</span></div>
            <div class="excel-toolbar" id="docs-toolbar" style="display: none;">
                <button onclick="loadRootDocs()">⬅ Up</button>
            </div>
            <div class="window-content" id="doc-list" style="height: calc(100% - 20px); padding: 10px; box-sizing: border-box;">
                <!-- Projects will be loaded here -->
            </div>
        </div>

        <div class="window" id="pocket-excel">
            <div class="window-header"><span id="excel-title">Excel 95 - Database Viewer</span><span class="close-btn" onclick="document.getElementById('pocket-excel').style.display='none'">X</span></div>
            <div class="excel-toolbar">
                <label>Table:</label>
                <select id="excel-table-select" onchange="loadTableData()"></select>
                <button onclick="loadTableData()">Refresh</button>
            </div>
            <div class="window-content" style="height: calc(100% - 50px); overflow: auto;">
                <table class="excel95" id="excel-grid">
                    <thead><tr id="excel-headers"></tr></thead>
                    <tbody id="excel-body"></tbody>
                </table>
            </div>
        </div>

        <div class="window" id="pocket-net">
            <div class="window-header"><span>Network Devices</span><span class="close-btn" onclick="document.getElementById('pocket-net').style.display='none'">X</span></div>
            <div class="window-content" id="device-list" style="padding: 10px;">
                <!-- Devices will be loaded here -->
            </div>
        </div>
    </div>

    <div id="taskbar">
        <button id="start-btn" onclick="toggleStartMenu()">Start</button>
        <div style="margin-left: 10px; font-size: 11px; padding: 2px 5px; border: 1px inset #fff;">My Documents</div>
    </div>

    <div id="start-menu">
        <div class="start-item" onclick="openWindow('pocket-cmd')"><div class="start-icon"></div>Pocket CMD</div>
        <div class="start-item" onclick="openWindow('pocket-mail')"><div class="start-icon"></div>Pocket Mail</div>
        <div class="start-item" onclick="openWindow('pocket-docs')"><div class="start-icon"></div>My Documents</div>
        <div class="start-item" onclick="openWindow('pocket-net')"><div class="start-icon"></div>Network Devices</div>
        <div style="height: 20px; background: #808080; color: #fff; font-size: 9px; padding: 2px 10px; font-weight: bold;">PROJECTS</div>
        <div class="start-item" onclick="alert('Switching to Singularity...')">Singularity</div>
        <div class="start-item" onclick="alert('Switching to H2O Matrix...')">H2O Matrix</div>
        <div style="height: 1px; background: #fff; margin: 2px 0;"></div>
        <div class="start-item" onclick="location.reload()">Shut Down...</div>
    </div>

    <script>
        // --- Start Menu ---
        function toggleStartMenu() {
            const menu = document.getElementById('start-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }
        
        function openWindow(id) {
            document.getElementById(id).style.display = 'block';
            document.getElementById('start-menu').style.display = 'none';
            // Bring to front
            document.querySelectorAll('.window').forEach(w => w.style.zIndex = 10);
            document.getElementById(id).style.zIndex = 100;
        }

        // --- CMD Logic ---
        const cmdIn = document.getElementById('cmd-in');
        const cmdOut = document.getElementById('cmd-out');

        cmdIn.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                const val = cmdIn.value;
                cmdOut.innerHTML += val + "<br>";
                fetch('/api/cmd', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({command: val})
                }).then(r => r.json()).then(data => {
                    cmdOut.innerHTML += data.output.replace(/\n/g, '<br>') + "<br>> ";
                    cmdOut.scrollTop = cmdOut.scrollHeight;
                });
                cmdIn.value = '';
            }
        });

        // --- Mail Logic ---
        fetch('/api/mail').then(r => r.json()).then(data => {
            const list = document.getElementById('mail-list');
            data.forEach(m => {
                list.innerHTML += `<div style="border-bottom: 1px solid #ccc; padding: 5px;">
                    <b>FROM:</b> MatrixEngine<br>
                    <b>SUBJECT:</b> Success: ${m[1]}<br>
                    <small>${m[3]}</small>
                </div>`;
            });
        });

        // --- Explorer Logic ---
        const docList = document.getElementById('doc-list');
        const docsTitle = document.getElementById('docs-title');
        const docsToolbar = document.getElementById('docs-toolbar');
        let currentDbPath = "";

        function loadRootDocs() {
            docsTitle.innerText = "My Documents";
            docsToolbar.style.display = "none";
            docList.style.height = "calc(100% - 20px)";
            
            fetch('/api/documents/root').then(r => r.json()).then(data => {
                docList.innerHTML = '';
                data.forEach(d => {
                    docList.innerHTML += `
                    <div class="icon" onclick="openFolder('${d.id}', '${d.name}')">
                        <div class="icon-img icon-folder"></div>
                        <span style="font-size: 10px;">${d.name}</span>
                    </div>`;
                });
            });
        }

        function openFolder(id, name) {
            docsTitle.innerText = name;
            docsToolbar.style.display = "flex";
            docList.style.height = "calc(100% - 45px)";
            
            if (id === 'global_db') {
                fetch('/api/databases').then(r => r.json()).then(data => {
                    docList.innerHTML = '';
                    data.forEach(db => {
                        docList.innerHTML += `
                        <div class="icon" onclick="openDatabase('${db.path}', '${db.name}')" title="${db.path}">
                            <div class="icon-img icon-db"></div>
                            <span style="font-size: 10px; word-wrap: break-word;">${db.name}</span>
                        </div>`;
                    });
                });
            } else {
                docList.innerHTML = '<div style="color: #666; font-style: italic;">Folder is empty or linking pending.</div>';
            }
        }

        // --- Excel 95 Database Viewer Logic ---
        function openDatabase(path, name) {
            currentDbPath = path;
            document.getElementById('pocket-excel').style.display = 'block';
            document.getElementById('excel-title').innerText = `Excel 95 - [${name}]`;
            
            // Bring to front
            document.getElementById('pocket-excel').style.zIndex = 100;
            document.getElementById('pocket-docs').style.zIndex = 10;
            
            loadTableData(null);
        }

        function loadTableData(tableName = null) {
            const payload = { db_path: currentDbPath };
            if (tableName) {
                payload.table = tableName;
            } else {
                // If triggered by select dropdown change
                const sel = document.getElementById('excel-table-select');
                if (sel.value) payload.table = sel.value;
            }

            fetch('/api/db/query', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            }).then(r => r.json()).then(data => {
                if (data.error) {
                    alert("Error: " + data.error);
                    return;
                }

                // Populate Select
                const sel = document.getElementById('excel-table-select');
                if (!tableName && (!sel.options.length || sel.options[0].value !== data.tables[0])) {
                    sel.innerHTML = '';
                    data.tables.forEach(t => {
                        const opt = document.createElement('option');
                        opt.value = t; opt.text = t;
                        if (t === data.current_table) opt.selected = true;
                        sel.appendChild(opt);
                    });
                }

                // Populate Headers
                const headers = document.getElementById('excel-headers');
                headers.innerHTML = '<th></th>'; // Row number column
                const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                data.columns.forEach((col, idx) => {
                    // Excel style headers (A, B, C...)
                    const l = idx < 26 ? letters[idx] : letters[Math.floor(idx/26)-1] + letters[idx%26];
                    headers.innerHTML += `<th>${l}<br><small style="font-size:8px;">${col}</small></th>`;
                });

                // Populate Body
                const tbody = document.getElementById('excel-body');
                tbody.innerHTML = '';
                data.rows.forEach((row) => {
                    const rowid = row[0];
                    const rowData = row.slice(1);
                    let tr = `<tr><td style="background:#c0c0c0;text-align:center;">${rowid}</td>`;
                    rowData.forEach((cell, idx) => {
                        const colName = data.columns[idx];
                        tr += `<td contenteditable="true" onblur="updateCell('${rowid}', '${colName}', this.innerText)">${cell !== null ? cell : ''}</td>`;
                    });
                    tr += `</tr>`;
                    tbody.innerHTML += tr;
                });
            });
        }

        function updateCell(rowid, colName, newVal) {
            fetch('/api/db/update', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    db_path: currentDbPath,
                    table: document.getElementById('excel-table-select').value,
                    rowid: rowid,
                    column: colName,
                    value: newVal
                })
            }).then(r => r.json()).then(data => {
                if (data.error) alert("Save Failed: " + data.error);
                else console.log("Cell updated.");
            });
        }

        // Load Devices
        function loadDevices() {
            fetch('/api/devices').then(r => r.json()).then(data => {
                const list = document.getElementById('device-list');
                list.innerHTML = '';
                data.forEach(dev => {
                    list.innerHTML += `<div style="border-bottom: 1px solid #ccc; padding: 5px; display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <b>${dev.device_id}</b> (${dev.os})<br>
                            <small>${dev.ip} - ${dev.status}</small>
                        </div>
                        <button onclick="alert('Connecting to ${dev.device_id}...')">Link</button>
                    </div>`;
                });
            });
        }

        // Init
        loadRootDocs();
        loadDevices();
        
        // Simple window dragging
        let draggedWin = null, offsetX = 0, offsetY = 0;
        document.querySelectorAll('.window-header').forEach(header => {
            header.addEventListener('mousedown', e => {
                if (e.target.classList.contains('close-btn')) return;
                draggedWin = header.parentElement;
                offsetX = e.clientX - draggedWin.offsetLeft;
                offsetY = e.clientY - draggedWin.offsetTop;
                // Bring to front
                document.querySelectorAll('.window').forEach(w => w.style.zIndex = 10);
                draggedWin.style.zIndex = 100;
            });
        });
        document.addEventListener('mousemove', e => {
            if (draggedWin) {
                draggedWin.style.left = (e.clientX - offsetX) + 'px';
                draggedWin.style.top = (e.clientY - offsetY) + 'px';
            }
        });
        document.addEventListener('mouseup', () => draggedWin = null);
    </script>
</body>
</html>
