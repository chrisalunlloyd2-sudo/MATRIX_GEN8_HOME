name: Update and Sync
on:
  push:
    branches:
      - main
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
      - name: Update TODO.md
        run: |
          git config --global user.name "chrisalunlloyd2-sudo"
          git config --global user.email "chrisalunlloyd2-sudo@users.noreply.github.com"
          git add sops/TODO.md
          git commit -m "Iteration 172: Update TODO.md"
          git push origin main
      - name: Sync with OneDrive
        uses: microsoft/onedrive-action@v1
        with:
          client-id: ${{ secrets.ONEDRIVE_CLIENT_ID }}
          client-secret: ${{ secrets.ONEDRIVE_CLIENT_SECRET }}
          drive-id: ${{ secrets.ONEDRIVE_DRIVE_ID }}
          path: sops/TODO.md
