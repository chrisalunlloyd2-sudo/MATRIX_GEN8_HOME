name: Update and Sync
on:
  push:
    branches:
      - main
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0 # Full history for robust git ops
          
      - name: Master Engine Sync (ZLC)
        run: |
          git config --global user.name "chrisalunlloyd2-sudo"
          git config --global user.email "chrisalunlloyd2-sudo@users.noreply.github.com"
          
          # Only commit if there are changes to avoid loop
          if [ -f sops/TODO.md ] && ! git diff --quiet sops/TODO.md; then
            git add sops/TODO.md
            git commit -m "[SYNC] Cloud-Layer TODO Update [skip ci]"
            git push origin main
          else
            echo "[-] No cloud-layer changes detected. Skipping commit."
          fi

